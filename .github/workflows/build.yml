name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app
      - name: Build
        run: |
          agvtool new-version -all $(git rev-parse --short HEAD)
          make iphoneos
          mv packages/Feather.ipa packages/Signet.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Signet-ipa
          path: packages/Signet.ipa
